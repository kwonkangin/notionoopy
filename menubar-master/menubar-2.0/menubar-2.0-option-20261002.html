<!--
=====================================================================================
menubar-2.0-option-20261004.html   |   메뉴바 옵션 2.0 (모양 변수 + 메뉴 내용 설정)
한 줄 설명 : 메뉴바의 모양(CSS 변수)과 내용(메뉴, 버튼, 검색, 모바일 옵션)을 정하는 파일. 대시보드가
             만든 코드를 붙여 넣는 자리다.
짝 파일    : menubar-2.0-20261004.css, menubar-2.0-20261004.js (엔진),
             menubar-2.0-dashboard-20261004.js (대시보드)
의존성     : 엔진보다 먼저 실행되어야 한다. 직접 고치기보다 대시보드로 출력해 통째로 교체하는 것을 권장한다.
=====================================================================================

[이 파일의 구성]  한 파일 안에 두 가지가 들어 있고, 대시보드가 둘을 한 번에 출력한다.
1) style 블록 : :root 안의 CSS 변수. 색, 크기, 간격 같은 "모양"을 정한다. (변수 총 112개)
2) script 블록 : window.efcMenubarConfig. 메뉴 이름, 링크, 하위메뉴, 버튼, 검색 같은 "내용"과 동작 옵션을 정한다.

[변수 이름 규칙]
- 이름 끝의 _a1, _c4 같은 접미사는 영역(알파벳)과 순번을 나타내는 식별 코드다. 값에는 영향이 없다.
- 엔진과 대시보드가 이름으로 변수를 찾으므로 이름을 바꾸거나 지우지 않는다.
- 색상은 #HEX, rgba(), transparent 로 쓴다. 길이 값은 px, 시간은 s 처럼 단위를 반드시 붙인다
  (단위가 빠지면 그 값은 무시된다). 굵기, z-index, 줄 수는 숫자만 쓴다.
- '선택' 변수(모바일 헤더 좌우 여백, 모바일 로고 높이, 모바일 상단바 검색 아이콘 내부 여백,
  모바일 검색창 위쪽 여백/너비)는 줄을 지우면 PC 값(또는 우피 기본)을 따른다. 값을 비워 두면
  (예: --mobileHeaderPaddingX_a9: ;) 안 되고, 쓰지 않을 때는 줄 자체를 지운다.
- 검색창 관련 변수(--searchPanel..., --searchResult...)는 해당 스위치(searchPanelCustom,
  searchRadiusCustom, searchResultCustom)가 true 일 때만 화면에 적용된다.

[CSS 변수 목록]  (의미 / 기본값 / 설정값 / 적용 범위)
  기본값은 대시보드가 처음 보여주는 값이다. '적용' 항목이 'PC 상세형만' 인 변수는 모바일과 심플형에는
  반영되지 않는다. 구역 이름은 대시보드의 구역과 같다.

[설정 객체 window.efcMenubarConfig]  (괄호 안은 대시보드 기본값)
- mobileBreakpoint (1024) : 이 너비(px) 이하이면 모바일 메뉴(햄버거)로 바뀐다.
- hideNotionTopbar (true) : 노션 기본 상단바를 화면 밖으로 보낼지.
- useHeaderShadow (true) : 스크롤했을 때 헤더 아래 그림자를 보여줄지.
- scrollEffect (true) / scrollThreshold (10) : 스크롤 시 그림자 효과 사용 여부 / 몇 px 내려가면 켤지.
- offsetBody (true) : 본문 위쪽에 헤더 높이만큼 여백을 자동으로 넣을지.
- logo : 로고 설정.
    url ("")        PC 로고 이미지 주소. 모바일에서도 기본으로 같은 로고를 쓴다.
    mobileUrl ("")  모바일 전용 로고 주소. 비우면 PC 로고를 그대로 쓴다.
    alt ("브랜드 로고")  이미지 대체 텍스트.
    link ("/")      로고를 눌렀을 때 이동할 주소.
- showArrowDefault (true) : 하위메뉴가 있는 대메뉴에 화살표를 보여줄지. 메뉴별 showArrow 가 있으면 그쪽이 우선.
- defaultDropdownStyle ("detailed") : dropdownStyle 이 없는 메뉴의 하위메뉴 종류. detailed(상세형) / simple(심플형).
- detailedWidthMode ("fixed") : 상세형 하위메뉴 너비 방식. fixed 는 --dropdownDetailedWidth_e4 고정,
  auto 는 글자 길이에 맞춰 --dropdownDetailedMinWidth_e22 ~ --dropdownDetailedMaxWidth_e23 사이에서 늘어난다.
- arrowAnimation (true) : 하위메뉴를 열고 닫을 때 화살표 회전 애니메이션을 쓸지(PC와 모바일 모두).
- 검색 관련
    useSearch (false)       true 이면 PC 헤더에 검색 버튼을 보여준다. 아래 모든 검색 옵션의 전제 조건.
    oopyPlan ("standard")   standard 는 .search-button 을, pro 는 .xi-search 를 먼저 찾고 없으면 반대쪽도 찾는다.
    searchPosition ("right") 검색 버튼 배치. right: PC 는 CTA 오른쪽 / 모바일 상단바 아이콘은 CTA 와 햄버거 사이 /
                            패널 검색 버튼은 CTA 아래. left: 각각 CTA 왼쪽 / CTA 왼쪽 / CTA 위.
    showMobileSearchBtn (true)  모바일 패널 하단에 검색 버튼을 보여줄지.
    showMobileSearchBar (false) 모바일 상단바(CTA 와 햄버거 사이)에 검색 아이콘을 보여줄지.
    searchPlaceholder ("")  열린 검색창 입력칸 문구(PC). 비우면 우피 기본 문구.
    searchPlaceholderMobile ("") 모바일 폭에서 쓸 문구. 비우면 PC 문구를 쓴다.
    searchPanelCustom (false)  true 이면 --searchPanelTop_s1 등 검색창 위치/크기 변수를 적용한다.
    searchRadiusCustom (false) true 이면 --searchPanelRadius_s5 를 적용한다.
    searchResultCustom (false) true 이면 --searchResult... 변수(글자 크기, 굵기, 색, 설명 줄 수)를 적용한다.
    searchResultShow { icon, location, desc, type, footer } (모두 true)  검색 결과의 아이콘, 위치(경로), 설명,
                            타입 배지, 하단 "검색 결과 n개" 문구를 보일지. 제목은 항상 보인다.
- showMobileDesc (true) : 모바일 하위메뉴에서도 설명글을 보여줄지.
- mobileAccordion (false) : true 이면 모바일에서 대메뉴를 펼칠 때 다른 대메뉴는 자동으로 접힌다.
  false 이면 여러 개를 동시에 펼쳐 둘 수 있다.
- mobileCtaLayout ("horizontal") : 모바일 패널 안 CTA 버튼 배열. horizontal(가로 그리드) / vertical(세로).
- mobileCtaGridCols (2) : 가로 배열일 때 열 개수(1~10).
- menuItems [ ... ] : 대메뉴 목록. 배열 순서가 화면의 왼쪽에서 오른쪽 순서다.
    label           대메뉴 이름.
    url             대메뉴를 눌렀을 때 이동할 주소. 하위메뉴가 있으면 보통 "#" (이동 없이 열기/닫기만 한다).
    target          _self(현재 창) / _blank(새 창).
    showArrow       (선택) true / false. 이 메뉴만 화살표를 켜거나 끈다. 없으면 showArrowDefault 를 따른다.
    dropdownStyle   하위메뉴가 있을 때의 종류. detailed / simple.
    children [ ... ]  하위메뉴 목록. 빈 배열이면 하위메뉴 없이 단일 링크가 된다.
        title       하위메뉴 제목.
        url, target 이동 주소 / 열기 방식.
        desc        설명글(상세형만 보임). 비우면 설명을 보여주지 않는다.
        icon        아이콘(상세형만 보임). type: fa / image / none.
                    value: fa 면 폰트어썸 클래스(예: fa-solid fa-star), image 면 이미지 주소.
                    color, hoverColor: (선택, fa 만) 이 항목만의 아이콘 색. 없으면 글로벌 아이콘 색을 쓴다.
- ctaButtons [ ... ] : CTA 버튼 목록. 배열 순서가 왼쪽에서 오른쪽 순서다.
    label           버튼 글자.
    url, target     이동 주소 / 열기 방식. (전화는 "tel:번호" 형식)
    variant         solid(채우기) / outline(테두리).
    showOnMobileBar true 이면 모바일 상단바(햄버거 옆)에도 버튼을 보여준다.

[사용법]
1) 대시보드(menubar-2.0-dashboard-20261004.js)에서 모양과 내용을 조정하고 '코드 출력하기'를 누른다.
2) 나온 코드(style 블록 + script 블록)로 이 파일 내용을 통째로 교체한다.
3) Oopy 코드 삽입에서 이 파일을 엔진(CSS, JS)보다 앞에 둔다.
4) 이전에 출력한 코드를 다시 불러와 수정하려면 대시보드의 '가져오기'에 붙여 넣는다.

[알려진 제한]
- 설정 이름은 window.efcMenubarConfig 하나만 인식한다. 이름이 다르면 메뉴가 비어 보인다.
- 일부 변수는 PC 상세형에만 적용된다(위 목록의 '적용' 참고). 대시보드에서 바꿔도 모바일이나 심플형에서는
  변화가 없을 수 있다.
- 키를 생략하면 엔진 내부 기본값이 쓰여 대시보드 기본값과 다를 수 있다. 대시보드가 출력한 코드를 그대로 쓴다.
- 변수 단위를 빼먹으면 해당 값이 무시된다.
- 검색창 커스텀은 노션 검색창 구조에 의존한다. 노션 쪽 구조가 바뀌면 우피 기본 모양으로 보일 수 있다.
